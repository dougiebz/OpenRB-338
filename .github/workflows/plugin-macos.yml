# The plugin's macOS bundles: CLAP, VST3 and the Audio Unit (scripts/package-plugin-macos.sh),
# built on a macOS runner and checked with Apple's auval. Started by hand, or by a push that
# touches the plugin, its script or this file. No secret; the bundles are workflow artifacts.
name: plugin (macOS)

on:
  workflow_dispatch:
  push:
    paths:
      - crates/orb-vst/**
      - scripts/package-plugin-macos.sh
      - .github/workflows/plugin-macos.yml

permissions:
  contents: read

jobs:
  bundles:
    name: CLAP, VST3 and AU (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: plugin-${{ matrix.target }}
      - name: Build the bundles
        run: scripts/package-plugin-macos.sh ${{ matrix.target }}
      - name: Validate the Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "dist/${{ matrix.target }}/plugin/OpenRB-338.component" \
            ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i openrb || true
          auval -v aumu Rb38 Orb3
      - name: Pack the bundles (a zip keeps the bundle layout and the signatures)
        if: always()
        run: |
          cd "dist/${{ matrix.target }}/plugin"
          for b in OpenRB-338.clap OpenRB-338.vst3 OpenRB-338.component; do
            [ -d "$b" ] && ditto -c -k --keepParent "$b" "$b.zip"
          done
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: plugin-${{ matrix.target }}
          path: dist/${{ matrix.target }}/plugin/*.zip
          if-no-files-found: warn
